name: Generar APK desde ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Descargar archivos subidos
      uses: actions/checkout@v4

    - name: Descomprimir el ZIP
      run: unzip -o AppCompleta.zip -d android_project
        
    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Configurar Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Compilar APK
      run: |
        cd $(dirname $(find android_project -name "settings.gradle" | head -n 1))
        chmod +x ./gradlew || true
        gradle assembleDebug --no-daemon

    - name: Subir APK Terminado
      uses: actions/upload-artifact@v4
      with:
        name: NoteGlow-Flotante-APK
        path: "**/app/build/outputs/apk/debug/*.apk"
